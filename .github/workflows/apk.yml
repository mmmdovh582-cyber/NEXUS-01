name: Build APK
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Capacitor qur
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Nexus com.nexus.robot --web-dir=www
          npx cap add android
          npx cap sync android
      - name: Icazələr
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/><uses-permission android:name="android.permission.BLUETOOTH_SCAN"/><application|' android/app/src/main/AndroidManifest.xml
      - name: APK build
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
